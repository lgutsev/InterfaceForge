name: tests

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # Include ASE so VASP/LOCPOT regression tests are exercised rather than
      # silently skipped on every supported Python version.
      - run: python -m pip install -e ".[dev,vasp]"
      - run: python -m compileall -q src
      - run: python -m unittest discover -s tests -v
      - run: ruff check src tests
