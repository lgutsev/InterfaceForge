[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "interfaceforge"
version = "0.1.0"
description = "Reproducible VASP, VASP-MLFF, MACE, and DeePMD campaigns for heterogeneous interfaces"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Lavrenty G. Gutsev"},
]
keywords = [
  "materials-science",
  "VASP",
  "machine-learning-potentials",
  "MACE",
  "DeePMD",
  "interfaces",
  "Slurm",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6",
]

[project.optional-dependencies]
vasp = ["ase>=3.23"]
mace-roi = ["ase>=3.23", "mace-torch>=0.3.17,<0.4"]
report = ["matplotlib>=3.7", "openpyxl>=3.1"]
dev = ["ase>=3.23", "pytest>=8", "ruff>=0.6"]
all = [
  "ase>=3.23",
  "matplotlib>=3.7",
  "openpyxl>=3.1",
]

[project.scripts]
iface = "interfaceforge.cli:main"
iface-mace-roi = "interfaceforge.mace_roi:main"

[project.urls]
Homepage = "https://github.com/lgutsev/InterfaceForge"
Repository = "https://github.com/lgutsev/InterfaceForge"
Issues = "https://github.com/lgutsev/InterfaceForge/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
interfaceforge = ["templates/*.yaml"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
