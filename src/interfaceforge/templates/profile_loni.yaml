name: loni
scheduler: slurm
ai2kit:
  ssh: {host: "YOUR_USER@YOUR_LONI_LOGIN"}
  work_dir: /project/YOUR_PROJECT/ai2kit-work
  python_cmd: /project/YOUR_PROJECT/envs/ai2kit/bin/python
  commands: {ai2kit: ai2-kit, deepmd: dp, lammps: lmp, vasp: vasp_std}
  jobs: {train: deepmd_gpu, explore: deepmd_gpu, label: vasp_workq}
  potcar_source:
    H: /project/YOUR_PROJECT/potcars/H/POTCAR
    O: /project/YOUR_PROJECT/potcars/O/POTCAR
  explore_concurrency: 1
  label_concurrency: 1
jobs:
  vasp_workq:
    partition: workq
    account: YOUR_LONI_ACCOUNT
    nodes: 1
    ntasks: 64
    cpus_per_task: 1
    time: "72:00:00"
    modules: [vasp6/6.5.1-cpu]
    environment: {OMP_NUM_THREADS: "1", SINGULARITYENV_OMP_NUM_THREADS: "1"}
    command: "srun -n {ntasks} vasp_gam"
  vasp_bigmem:
    partition: bigmem
    account: YOUR_LONI_ACCOUNT
    nodes: 2
    ntasks: 128
    cpus_per_task: 1
    time: "48:00:00"
    modules: [vasp6/6.5.1-cpu]
    environment: {OMP_NUM_THREADS: "1", SINGULARITYENV_OMP_NUM_THREADS: "1"}
    command: "srun -n {ntasks} vasp_gam"
  mace_gpu:
    partition: gpu2
    account: YOUR_LONI_ACCOUNT
    nodes: 1
    ntasks: 1
    cpus_per_task: 8
    gpus: 1
    time: "72:00:00"
    modules: []
    preamble: ['source "${MACE_ACTIVATE_SCRIPT:?Set MACE_ACTIVATE_SCRIPT}"']
    environment: {OMP_NUM_THREADS: "1", MKL_NUM_THREADS: "1", PYTHONUNBUFFERED: "1"}
  deepmd_gpu:
    partition: gpu2
    account: YOUR_LONI_ACCOUNT
    nodes: 1
    ntasks: 1
    cpus_per_task: 8
    gpus: 1
    time: "72:00:00"
    modules: []
    preamble: ['if [[ -n "${DEEPMD_ACTIVATE_SCRIPT:-}" ]]; then source "${DEEPMD_ACTIVATE_SCRIPT}"; fi']
    environment:
      OMP_NUM_THREADS: "8"
      TF_FORCE_GPU_ALLOW_GROWTH: "true"
      DP_INFER_BATCH_SIZE: "4096"
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
      CUDA_DEVICE_ORDER: PCI_BUS_ID
  allegro_gpu:
    partition: gpu2
    account: YOUR_LONI_ACCOUNT
    nodes: 1
    ntasks: 1
    cpus_per_task: 8
    gpus: 1
    time: "72:00:00"
    modules: []
    preamble: ['source "${ALLEGRO_ACTIVATE_SCRIPT:?Set ALLEGRO_ACTIVATE_SCRIPT}"']
    environment:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
      CUDA_DEVICE_ORDER: PCI_BUS_ID
  allegro_lammps:
    partition: gpu2
    account: YOUR_LONI_ACCOUNT
    nodes: 1
    ntasks: 1
    cpus_per_task: 8
    gpus: 1
    time: "24:00:00"
    modules: []
    preamble: ['if [[ -n "${ALLEGRO_ACTIVATE_SCRIPT:-}" ]]; then source "${ALLEGRO_ACTIVATE_SCRIPT}"; fi']
    environment:
      OMP_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
      CUDA_DEVICE_ORDER: PCI_BUS_ID
