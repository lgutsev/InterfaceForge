schema_version: 1

project:
  name: example-interface
  description: Reproducible DFT-to-MLIP interface campaign

profile: profiles/loni.yaml

reference:
  engine: vasp
  functional: PBE
  inputs:
    INCAR: inputs/INCAR
    KPOINTS: inputs/KPOINTS
    POTCAR: inputs/POTCAR

systems:
  - id: bulk_a_300k
    kind: bulk
    structure: structures/bulk_a.vasp
    temperature: 300
    tags:
      material: phase_a
  - id: bulk_b_300k
    kind: bulk
    structure: structures/bulk_b.vasp
    temperature: 300
    tags:
      material: phase_b
  - id: interface_ab_300k
    kind: interface
    structure: structures/interface_ab.vasp
    temperature: 300
    tags:
      termination: primary

stages:
  vasp_mlff:
    # Opt in only when InterfaceForge should generate new VASP-MLFF labels.
    # Existing DFT OUTCAR campaigns should leave this false.
    enabled: false
    accuracy_profile: accurate
    train:
      nsw: 3000
      potim: 1.0
      profile: vasp_workq
    refit:
      profile: vasp_workq
    stability:
      nsw: 3000
      profile: vasp_workq

dataset:
  strategy: grouped
  stride: 5
  ratios: [0.8, 0.1, 0.1]
  guard_frames: 20
  preserve_raw_forces: true
  include_virial: false
  type_map: []

models:
  mace:
    enabled: true
    profile: mace_gpu
    train_file: datasets/canonical/train.extxyz
    valid_file: datasets/canonical/valid.extxyz
    batch_size: 16
    max_num_epochs: 200
    stage2_max_num_epochs: 100
    roi:
      enabled: false
      source_dir: datasets/canonical
      output_dir: datasets/mace_roi
      cutoff: 3.5
      interface_multiplier: 4.0
      shell_depth: 0
      component_key: IF_component
      component_ranges: {}
      cycle_weight: 0.0
  deepmd:
    enabled: true
    profile: deepmd_gpu
    backend: tensorflow
    descriptor: dpa1
    architectures: [dpa1]
    committee: 4
    seeds: [11, 23, 37, 53]
    numb_steps: 500000
    batch_atoms: 1024
  allegro:
    enabled: false
    profile: allegro_gpu
    lammps_profile: allegro_lammps
    train_file: datasets/canonical/train.extxyz
    valid_file: datasets/canonical/valid.extxyz
    test_file: datasets/canonical/test.extxyz
    type_names: []
    r_max: 5.0
    batch_size: 4
    max_epochs: 200
    learning_rate: 0.001
    l_max: 1
    num_layers: 2
    num_scalar_features: 64
    num_tensor_features: 32
    compile_device: cuda

exploration:
  temperatures: [300, 450, 600]
  strains: [-0.03, 0.0, 0.03]
  replicas: 2

active_learning:
  enabled: false
  engine: ai2kit
  approval_required: true
  max_iterations: 1
  output_root: runs/active_learning/ai2kit
  ai2kit:
    workflow: tesla_mace
    version: "1.0.9"
    omb_version: "0.7.2"
    executor_name: loni
    trainer: mace
    explorer: openmm
    labeler: vasp
    selector: model_deviation
    model_count: 4
    committee_models:
      - models/committee/model-0.model
      - models/committee/model-1.model
      - models/committee/model-2.model
      - models/committee/model-3.model
    committee_seeds: [11, 23, 37, 53]
    training_artifacts: [datasets/canonical/train.extxyz]
    validation_artifacts: [datasets/canonical/valid.extxyz]
    exploration_artifacts: [structures/interface_ab.vasp]
    trust_force_low: 0.10
    trust_force_high: 0.25
    selection_limit: 20
    md_steps: 10000
    sample_frequency: 20
    timestep_fs: 0.5
    default_dtype: float64

validation:
  parity: true
  short_md_steps: 10000
  work_of_adhesion: true
  separation_curve: true
  rdf: true
  coordination: true

  # Per-interface structural facts the property tools cannot infer from the
  # dataset. `match` is an fnmatch pattern against the interface leaf / system
  # id; every matching entry is merged (earlier entries win).
  #
  # interfaces:
  #   - match: "interface/*/*/N_Term/*"
  #     stacking_axis: c            # a|b|c; sets the interface-energy area plane
  #     n_interfaces: 2             # equivalent interfaces per periodic cell
  #     orientation: "Si3N4(0001)/TiN(111)"
  #     termination: N              # selects which reference values apply
  #     polar_termination: true     # (111)/(0001) alternate pure-element planes;
  #                                 # `iface validate interface-energy` then skips
  #                                 # this leaf -- use `iface validate adhesion`
  #
  # Literature cross-checks. `reference_profiles` pulls bundled profiles
  # (`iface reference list`); `references` adds one-off values inline. A
  # computed work of adhesion / surface energy is compared to every value whose
  # `match` keys all appear in the interface metadata.
  #
  # reference_profiles: [sharifi2026]
  # references:
  #   - key: my_dft
  #     quantity: work_of_adhesion
  #     tolerance_j_per_m2: 0.4
  #     values:
  #       - {match: {termination: Ti}, value_j_per_m2: 3.10}
