schema_version: 1

project:
  name: example-interface
  description: Reproducible DFT-to-MLIP interface campaign

profile: profiles/loni.yaml

reference:
  engine: vasp
  functional: PBE
  inputs:
    INCAR: inputs/INCAR
    KPOINTS: inputs/KPOINTS
    POTCAR: inputs/POTCAR

systems:
  - id: bulk_a_300k
    kind: bulk
    structure: structures/bulk_a.vasp
    temperature: 300
    tags:
      material: phase_a
  - id: bulk_b_300k
    kind: bulk
    structure: structures/bulk_b.vasp
    temperature: 300
    tags:
      material: phase_b
  - id: interface_ab_300k
    kind: interface
    structure: structures/interface_ab.vasp
    temperature: 300
    tags:
      termination: primary

stages:
  vasp_mlff:
    enabled: true
    train:
      nsw: 3000
      potim: 1.0
      profile: vasp_workq
    refit:
      profile: vasp_workq
    stability:
      nsw: 3000
      profile: vasp_workq

dataset:
  strategy: grouped
  stride: 5
  ratios: [0.8, 0.1, 0.1]
  guard_frames: 20
  preserve_raw_forces: true
  include_virial: false
  type_map: []

models:
  mace:
    enabled: true
    profile: mace_gpu
    train_file: datasets/canonical/train.extxyz
    valid_file: datasets/canonical/valid.extxyz
    batch_size: 16
    max_num_epochs: 200
    stage2_max_num_epochs: 100
  deepmd:
    enabled: true
    profile: deepmd_gpu
    backend: tensorflow
    descriptor: dpa1
    architectures: [dpa1]
    committee: 4
    seeds: [11, 23, 37, 53]
    numb_steps: 500000
    batch_atoms: 1024

exploration:
  temperatures: [300, 450, 600]
  strains: [-0.03, 0.0, 0.03]
  replicas: 2

active_learning:
  enabled: false
  engine: ai2kit
  approval_required: true
  max_iterations: 1
  output_root: runs/active_learning/ai2kit
  ai2kit:
    version: "1.0.9"
    executor_name: loni
    trainer: deepmd
    explorer: lammps
    labeler: vasp
    selector: model_deviation
    architecture: se_e2_a
    backend: tensorflow
    model_count: 4
    training_artifacts: [datasets/canonical/deepmd/train]
    validation_artifacts: [datasets/canonical/deepmd/valid]
    exploration_artifacts: [structures/interface_ab.vasp]
    trust_force_low: 0.15
    trust_force_high: 0.30
    selection_limit: 20

validation:
  parity: true
  short_md_steps: 10000
  work_of_adhesion: true
  separation_curve: true
  rdf: true
  coordination: true
