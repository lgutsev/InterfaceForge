# SiN/TiN rescue release policy for the first A2 (production). Checked with
#   iface-rescue-release plan --ledger <frozen split_ledger.tsv> --policy examples/source-rescue/release_policy.yaml [--deck <deck>]
# and used by
#   iface-rescue-release assemble --ledger <frozen split_ledger.tsv> \
#     --policy examples/source-rescue/release_policy.yaml --deck <admission-gated recollection> --output <new release>
# The ledger is frozen from the historical deck (D:\MLIP_Work_Folder\sin_tin_a2\rescue_2026-10-05\freeze,
# sha256 ed7ff1b9...); every kept or replaced frame keeps its split. Every source needs a rule (exact name,
# then the first matching glob in file order). Replacements are reviewed same-geometry relabels (one VASP run
# each: E_sigma->0, forces and virial = -V sigma), pinned by sha256 and mapped to deck frames by their
# package manifest. label_use: all | energy_forces (virial not trained) | forces_virial (energy not trained).
# Original labels are never edited. Decisions: SiN-TiN_Dispatch dispatch/desk_events.jsonl and STATUS.md.
# Encoding these rules is not launch authorization: the A2 launch is the PI's separate approval.
schema_version: 1
type_map: [Si, N, Ti, O]  # the historical DeePMD order
sources:
  bulk_SiN-Bulk_450K:
    action: exclude
    reason: "Unqualified 450 K sampling (2026-10-02 quarantine); diagnostics only"
  bulk_TiN-Bulk_450K:
    action: exclude
    reason: "Unqualified 450 K sampling (2026-10-02 quarantine); diagnostics only"
  bulk_TiO-Bulk-Ideal_300K:
    action: exclude
    reason: "TiO-Ideal (8-atom, -84 GPa uniaxial) excluded from every split"
  bulk_TiO-Bulk-Ideal_450K:
    action: exclude
    reason: "TiO-Ideal (8-atom, -84 GPa uniaxial) excluded from every split"
  bulk_SiN-Bulk_300K:
    action: replace_subset
    unreplaced: hold
    label_use: all  # SD016: 3x3x7 converged in every channel (<= 0.0001 GPa), so the virial trains
    reason: >-
      Gamma labels off by +137.7 meV/atom, 20 % force, 8.4 GPa (SD004 review). SD004's 150 k_norm relabels
      (120/15/15, frozen splits) approved for training by the PI 2026-10-16; the other 450 frames are held
      and their stored labels stay quarantined
  bulk_TiN-Bulk_300K:
    action: replace_subset
    unreplaced: hold
    label_use: energy_forces  # decision 8 as revisited 2026-10-19: SD014 stress off by a systematic 0.15 GPa
    reason: >-
      Gamma labels off by +2.7 meV/atom, 15 % force, 5.1 GPa (SD005, SD011 reviews). SD005's 48 + SD011's 102
      relabels at 3x3x5 (120/15/15, frozen splits) train on energies and forces, virial out (decision 8a/8d,
      revisited after SD014); the other 450 frames are held and their stored labels stay quarantined
  bulk_TiO-Bulk-Real_300K:
    action: replace_subset
    unreplaced: hold
    reason: "Gamma labels off by 0.08 eV/A force RMSE (package 21); 240-frame relabel subset first, rest held"
  bulk_TiO-Bulk-Real_450K:
    action: replace_subset
    unreplaced: hold
    reason: "Gamma labels off by 0.08 eV/A force RMSE (package 21); 240-frame relabel subset first, rest held"
  interface_*K_Ideal_Ti_Term_*:
    # The 10 Ideal Ti-terminated sources (300/450 K, O 0/0.25/0.5/0.75/1.0). Must stay above interface_*.
    # The package 23-era HOLD on interface_450K_Ideal_Ti_Term_SiN-TiN-Ti-term was lifted by the PI
    # 2026-10-21: package 23's Normal controls passed, SD003 frame_0010 reproduced the stored label of
    # frame 2725, and SD015 f2015 from that source meets decision 4.
    action: keep
    label_use: energy_forces
    reason: >-
      Decision 4 (PI 2026-10-19, reviewed 2026-10-20): force-ratio limit 6 % for this family, energies and
      forces in training, virial out (stress misses up to 0.21 GPa), stored labels unedited; 13 of 14 measured
      frames meet it, SD003 frame_0002 (300 K O 0.25, MD frame 265) is a logged exception
  interface_*:
    action: keep  # B0 interface criteria (approved 2026-10-15); measured Gamma biases meet them; all labels
