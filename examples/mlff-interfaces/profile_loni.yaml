name: loni
scheduler: slurm
jobs:
  # Matches the maintainer's production runvasp.sh convention exactly:
  # workq, 2 nodes / 128 MPI tasks, vasp6/6.5.1-cpu, vasp_std.
  vasp_train:
    partition: workq
    account: loni_perovsk27
    nodes: 2
    ntasks: 128
    cpus_per_task: 1
    time: "72:00:00"
    modules: [vasp6/6.5.1-cpu]
    environment: {SINGULARITYENV_OMP_NUM_THREADS: "1"}
    command: |
      SECONDS=0
      srun -n{ntasks} vasp_std
      echo "took $SECONDS sec."
  # Sized identically to vasp_train: each array task runs one leaf's own
  # run.slurm (which already loads vasp6/6.5.1-cpu itself), so this job
  # entry only needs the resource request -- its own "command" is unused,
  # since `iface mlff-interfaces array-launch` always supplies one.
  vasp_train_array:
    partition: workq
    account: loni_perovsk27
    nodes: 2
    ntasks: 128
    cpus_per_task: 1
    time: "72:00:00"
    modules: []
