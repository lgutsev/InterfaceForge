name: loni
scheduler: slurm
jobs:
  # Production default while VASP 6.6.1 licensing/runtime is evaluated.
  # workq, 2 nodes / 128 MPI tasks, vasp_std.
  vasp_train:
    partition: workq
    account: loni_perovsk27
    nodes: 2
    ntasks: 128
    cpus_per_task: 1
    time: "72:00:00"
    modules: [vasp6/6.5.1-cpu]
    environment: {SINGULARITYENV_OMP_NUM_THREADS: "1"}
    command: |
      SECONDS=0
      srun -n{ntasks} vasp_std
      echo "took $SECONDS sec."
  # Explicit VASP 6.6.1 MLIP-training test profile. Do not select until the
  # licensing/runtime path is confirmed. Select profile_name=vasp_train_661.
  vasp_train_661:
    partition: workq
    account: loni_perovsk27
    nodes: 2
    ntasks: 128
    cpus_per_task: 1
    time: "72:00:00"
    modules: [vasp6/6.6.1-cpu]
    environment: {SINGULARITYENV_OMP_NUM_THREADS: "1"}
    command: |
      SECONDS=0
      srun -n{ntasks} vasp_std
      echo "took $SECONDS sec."
  # Optional resource override. The array launcher executes the selected
  # stage profile's command directly in each leaf and inherits its
  # modules/environment; this entry therefore only controls Slurm resources.
  vasp_train_array:
    partition: workq
    account: loni_perovsk27
    nodes: 2
    ntasks: 128
    cpus_per_task: 1
    time: "72:00:00"
    modules: []
