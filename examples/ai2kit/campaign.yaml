schema_version: 1
project: {name: ai2kit-supervised-smoke}
profile: profile_loni.yaml
reference:
  engine: vasp
  inputs: {INCAR: inputs/INCAR, KPOINTS: inputs/KPOINTS}
systems:
  - {id: interface, kind: interface, structure: structures/interface.vasp}
dataset:
  strategy: grouped
  ratios: [0.8, 0.1, 0.1]
  preserve_raw_forces: true
  type_map: [H, O]
models:
  deepmd:
    enabled: true
    profile: deepmd_gpu
    backend: tensorflow
    descriptor: se_e2_a
    architectures: [se_e2_a]
    committee: 4
    seeds: [11, 23, 37, 53]
    numb_steps: 10000
exploration: {temperatures: [300], strains: [0.0], replicas: 1}
active_learning:
  enabled: true
  engine: ai2kit
  approval_required: true
  max_iterations: 1
  output_root: runs/active_learning/ai2kit
  ai2kit:
    version: "1.0.9"
    executor_name: loni
    trainer: deepmd
    explorer: lammps
    labeler: vasp
    selector: model_deviation
    architecture: se_e2_a
    backend: tensorflow
    model_count: 4
    training_artifacts: [datasets/canonical/deepmd/train]
    validation_artifacts: [datasets/canonical/deepmd/valid]
    exploration_artifacts: [structures/interface.vasp]
    trust_force_low: 0.15
    trust_force_high: 0.30
    selection_limit: 20
